[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shoe-store-backend"
version = "0.1.0"
description = "Backend for the shoe store coursework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "pandas>=2.2",
  "openpyxl>=3.1",
]

[tool.setuptools]
package-dir = {"" = "app"}

[tool.setuptools.packages.find]
where = ["app"]

